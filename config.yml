baseURL: "https://nidr0x.win/"
title: "Carlos Rodríguez | Platform Engineer"
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Carlos Rodríguez
  description: "Platform engineer focused on developer experience, infrastructure, and reliable delivery."
  author: Carlos Rodríguez
  # author: ["Me", "You"] # multiple authors
  #images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: dark # dark, light
  disableThemeToggle: true 
  robotsNoIndex: true

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false
  hideFooter: true

  assets:
    # disableHLJS: true # to disable highlight.js
    disableFingerprinting: true
    favicon: "favicon.svg"
    favicon16x16: "favicon.svg"
    favicon32x32: "favicon.svg"
    apple_touch_icon: "favicon.svg"
    safari_pinned_tab: "favicon.svg"

  # profile-mode
  profileMode:
    enabled: true
    title: Carlos Rodríguez
    subtitle: "Platform engineer working on infrastructure, developer workflows, and systems that stay operable under real load."
    imageWidth: 120
    imageHeight: 120
    buttons:
      - name: Email
        url: "mailto:nidr0x@gmail.com"
      - name: GitHub
        url: "https://github.com/nidr0x"
      - name: LinkedIn
        url: "https://linkedin.com/in/carlos-rodriguez-m50b30"

  # home-info mode
  homeInfoParams:
    Title: "Carlos Rodríguez"
    Content: "Platform engineer"

  homeSections:
    - title: "What I work on"
      intro: "I care about the parts of software delivery that teams depend on every day."
      items:
        - title: "Developer experience"
          body: "Tooling, workflows, and platform interfaces that reduce friction and make the correct path the easy path."
        - title: "Infrastructure"
          body: "Build and runtime systems with an emphasis on operability, predictable changes, and low maintenance overhead."
        - title: "Delivery"
          body: "CI/CD, release process design, and the guardrails needed to ship frequently without turning every deploy into a negotiation."
        - title: "Platform engineering"
          body: "The connective layer between teams, tooling, and infrastructure: shared capabilities that make delivery more consistent across the organization."

  socialIcons:
    - name: instagram
      url: "https://instagram.com/nidr0x"
    - name: github
      url: "https://github.com/nidr0x"
    - name: linkedin
      url: "https://linkedin.com/in/carlos-rodriguez-m50b30"
    - name: email 
      url: "mailto:nidr0x@gmail.com"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai
